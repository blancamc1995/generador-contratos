name: Publicar en Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      HAY_CLAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - if: env.HAY_CLAVE == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: gestion-alquileres
          channelId: live
