name: Publicar en Firebase Hosting
# Cada cambio en main se publica en https://gestion-alquileres-35943.web.app
# Sin claves guardadas: GitHub se identifica ante Google (Workload Identity Federation).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/772414745528/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-publicar@gestion-alquileres-35943.iam.gserviceaccount.com
      - name: Publicar
        run: |
          set -o pipefail
          npx --yes firebase-tools@13 deploy --only hosting --project gestion-alquileres-35943 --non-interactive 2>&1 | tee salida.txt || {
            tail -n 25 salida.txt | sed 's/^/::error::/'
            [ -f firebase-debug.log ] && grep -iE 'error|denied|permission|HTTP Error' firebase-debug.log | tail -n 15 | sed 's/^/::error::/'
            exit 1
          }
